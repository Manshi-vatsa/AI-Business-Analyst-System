# ===============================
# APP CONFIG
# ===============================
spring.application.name=ai-analytics-backend

server.address=0.0.0.0
server.port=8080
spring.profiles.active=dev

# ===============================
# DATABASE (MySQL) - PRODUCTION READY
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/ai_analytics?useSSL=false&serverTimezone=UTC&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=Manshi@263
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HIKARI CONNECTION POOL - OPTIMIZED
# ===============================
spring.datasource.hikari.pool-name=ai-analytics-pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# ===============================
# JPA / HIBERNATE - OPTIMIZED
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# LOGGING - PRODUCTION READY
# ===============================
logging.level.com.ai.analytics=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ===============================
# REST TEMPLATE CONFIGURATION
# ===============================
spring.web.client.connect-timeout=5000
spring.web.client.read-timeout=30000

# ===============================
# ACTUATOR ENDPOINTS
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized